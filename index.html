<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予定調整">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='14' width='84' height='78' fill='%231f3a5f'/%3E%3Crect x='8' y='14' width='84' height='20' fill='%23142941'/%3E%3Crect x='20' y='46' width='16' height='14' fill='%23fff'/%3E%3Crect x='42' y='46' width='16' height='14' fill='%23fff'/%3E%3Crect x='64' y='46' width='16' height='14' fill='%23fff'/%3E%3Crect x='20' y='68' width='16' height='14' fill='%23fff'/%3E%3Crect x='42' y='68' width='16' height='14' fill='%23fff'/%3E%3C/svg%3E">
<base target="_top">
<meta name="robots" content="noindex,nofollow">
<title>予定調整アプリ</title>
<style>
:root{
  --bg:#eef0f3; --card:#fff; --ink:#1f2933; --muted:#667085; --line:#d0d5dd; --soft:#f2f4f7;
  --pri:#1f3a5f; --pri-ink:#fff; --bar:#1f3a5f;
  --me:#1f5fa8; --me-bg:#e6eef8;
  --pt:#a8530a; --pt-bg:#fbeedd;
  --both:#1b7f4b; --both-bg:#e0f2e8;
  --conf:#3b4552; --conf-ink:#fff; --conf-bg:#eceff3;
  --ok:#1b7f4b; --maybe:#9a6700; --ng:#667085;
  --red:#c0262d;
  --shadow:0 6px 24px rgba(15,23,42,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161c; --card:#1a2029; --ink:#e6e9ee; --muted:#9aa3b2; --line:#303846; --soft:#222a35;
    --pri:#4f7cc4; --pri-ink:#fff; --bar:#0f141b;
    --me:#7fb0ee; --me-bg:#1d2d45;
    --pt:#f0a860; --pt-bg:#40291a;
    --both:#62d393; --both-bg:#16342380;
    --conf:#aab4c3; --conf-ink:#12161c; --conf-bg:#262e3a;
    --ok:#62d393; --maybe:#e8bf5a; --ng:#9aa3b2;
    --red:#ff7b80;
    --shadow:0 6px 24px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:0 0 40px}

/* ヘッダーバー */
.bar{background:var(--bar);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px}
.bar{flex-wrap:wrap}
.bar h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.barr{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#d6dde8;white-space:nowrap}
#saving{min-width:48px;text-align:right}
.logout{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:3px;padding:3px 10px;font-size:12px}
#main{padding:12px 12px 0}

/* 状況 */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sum{flex:1 1 220px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);padding:8px 12px;font-size:13px}
.sum b{font-size:16px}
.sum.need{border-left-color:var(--pt);background:var(--pt-bg)}
.sum button{border:0;background:var(--pt);color:#fff;border-radius:3px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap}
@media (prefers-color-scheme: dark){ .sum button{color:#12161c} }

/* 月ナビ */
.monthbar{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.monthbar h2{flex:1;margin:0;font-size:17px;text-align:center;font-weight:700}
.nav{border:1px solid var(--line);background:var(--card);border-radius:3px;min-width:38px;height:34px;font-size:16px}
.nav.today{padding:0 12px;font-size:13px}

/* 凡例 */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:1px}
.dot.me{background:var(--me)} .dot.pt{background:var(--pt)} .dot.both{background:var(--both)} .dot.conf{background:var(--conf)}

/* カレンダー(罫線のある表) */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.wd{background:var(--soft);text-align:center;font-size:12px;font-weight:600;padding:4px 0;color:var(--muted)}
.wd.sun{color:var(--red)}
.day{background:var(--card);border:0;border-radius:0;min-height:124px;padding:3px 2px 3px;
  display:flex;flex-direction:column;gap:2px;text-align:left;position:relative;min-width:0}
.day.blank{background:var(--soft);cursor:default}
.day.past{background:var(--soft)}
.day.past .n b{color:var(--muted)}
.day.past .pill{opacity:.65}
.day.today{box-shadow:inset 0 0 0 2px var(--pri)}
.day .n{display:flex;align-items:baseline;gap:3px;padding-left:2px;min-width:0}
.day .n b{font-size:12.5px;font-weight:700}
.day .n small{font-size:8.5px;color:var(--red);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1}
.day.sun .n b,.day.hol .n b{color:var(--red)}
.pill{display:flex;justify-content:space-between;align-items:center;font-size:10px;line-height:1.3;
  border-radius:2px;padding:0 3px;font-weight:600;border-left:3px solid transparent}
.pill i{font-style:normal}
.pill.empty{visibility:hidden}
.k-me{background:var(--me-bg);color:var(--me);border-left-color:var(--me)}
.k-pt{background:var(--pt-bg);color:var(--pt);border-left-color:var(--pt)}
.k-both{background:var(--both-bg);color:var(--both);border-left-color:var(--both)}
.k-conf{background:var(--conf);color:var(--conf-ink);border-left-color:var(--conf)}
.day.need::after{content:"";position:absolute;top:5px;right:4px;width:7px;height:7px;background:var(--pt)}

/* 確定リスト */
.listcard{background:var(--card);border:1px solid var(--line);padding:10px 12px;margin-top:14px}
.listcard h3{margin:0 0 6px;font-size:14px;padding-bottom:6px;border-bottom:2px solid var(--pri)}
.listcard ul{list-style:none;margin:0;padding:0}
.listcard li{padding:7px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;cursor:pointer}
.listcard li:first-child{border-top:0}
.listcard .d{font-weight:700;white-space:nowrap}
.listcard .t{flex:1}
.listcard .s{font-size:12px;color:var(--muted)}
.empty-note{color:var(--muted);font-size:13px;margin:4px 0}

/* シート */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.5)}
.panel{position:relative;width:100%;max-width:580px;max-height:92vh;overflow:auto;background:var(--card);
  border-radius:6px 6px 0 0;padding:14px 14px 26px;box-shadow:var(--shadow);animation:up .15s ease-out}
@media (min-width:700px){ .sheet{align-items:center} .panel{border-radius:6px} }
@keyframes up{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:8px;border-bottom:2px solid var(--pri)}
.sh-date{font-size:18px;font-weight:700}
.sh-sub{font-size:12px;color:var(--red);min-height:18px}
.sh-sub.muted{color:var(--muted)}
.x{border:1px solid var(--line);background:var(--card);width:32px;height:32px;border-radius:3px;font-size:14px}
.panel section{margin-top:14px}
.panel h3{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.panel h3 small{font-weight:400;color:var(--muted);font-size:11.5px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:8px 14px;font-weight:600;font-size:13.5px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.ocmts{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ocl{display:flex;align-items:center;gap:8px;font-size:12.5px}
.ocl span{width:4.6em;flex:none;color:var(--muted)}

.card{border:1px solid var(--line);border-left-width:4px;padding:9px 12px;margin-bottom:8px;background:var(--card)}
.card.k-me{border-left-color:var(--me)} .card.k-pt{border-left-color:var(--pt)}
.card.k-both{border-left-color:var(--both)} .card.conf{border-left-color:var(--conf);background:var(--conf-bg)}
.ch{display:flex;align-items:center;gap:8px}
.ch b{font-size:14.5px}
.ch .hint{font-size:11.5px;color:var(--muted)}
.badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:2px}
.badge.me{background:var(--me-bg);color:var(--me)} .badge.pt{background:var(--pt-bg);color:var(--pt)}
.badge.both{background:var(--both-bg);color:var(--both)} .badge.conf{background:var(--conf);color:var(--conf-ink)}
.note{margin:6px 0;font-size:13px}
.note.OK{color:var(--ok)} .note.MAYBE{color:var(--maybe)} .note.NG{color:var(--ng)} .note.wait{color:var(--muted)}
.cmtshow{font-size:13px;background:var(--soft);border-left:3px solid var(--line);padding:5px 9px;margin:4px 0}
.ans{display:flex;gap:6px;margin:6px 0}
.ab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:8px 4px;font-weight:700;font-size:13px}
.ab.OK.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ab.MAYBE.on{background:#b07a00;border-color:#b07a00;color:#fff}
.ab.NG.on{background:#667085;border-color:#667085;color:#fff}
.ab:disabled{opacity:.5}
input[type=text],input[type=password]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:3px;padding:7px 9px;font:inherit;font-size:14px}
input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--pri);outline-offset:-1px}
.bulk{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.bulk button{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:4px 10px;font-weight:600}
.btn{border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);border-radius:3px;padding:8px 16px;font-weight:700;font-size:13.5px}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.6}
.lnk{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px 0;font-size:12.5px}
.confirm-open{margin-top:6px;border:1px solid var(--pri);background:var(--card);color:var(--pri);
  border-radius:3px;padding:7px 12px;font-weight:700;width:100%}
@media (prefers-color-scheme: dark){ .confirm-open{color:var(--ink)} }
.cform{margin-top:8px;display:flex;flex-direction:column;gap:8px;background:var(--soft);padding:10px;border:1px solid var(--line)}
.cform .lb{font-size:12px;color:var(--muted);margin-bottom:-4px}
.cform .row{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.cform label{display:inline-flex;align-items:center;gap:5px}
.cform .btns{display:flex;gap:8px}
.ct{font-weight:700;font-size:14.5px;margin-top:4px}
.cm{font-size:13px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:9px 16px;
  border-radius:3px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1} #toast.err{background:#b42318}
.center{padding:60px 16px;text-align:center;color:var(--muted)}

/* ログイン */
.login{max-width:340px;margin:48px auto 0;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pri);padding:22px 20px}
.login h2{margin:0 0 4px;font-size:17px}
.login p{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.login input[type=text],.login input[type=password]{padding:10px 11px;font-size:16px}
.login .tg{display:block;margin:6px 0 14px}
.login .btn{width:100%;padding:10px}
.login .msg{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <h1 id="title">予定調整アプリ</h1>
    <div class="barr"><span id="saving"></span><span id="who"></span></div>
  </header>
  <div id="main"><div class="center">読み込み中…</div></div>
</div>

<div id="sheet" class="sheet hidden">
  <div class="backdrop" data-act="close"></div>
  <div class="panel" id="panel"></div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
// 「1日中」は noAll でない枠すべて。宿泊可は別枠(1日中に含めない)
var SLOTS=[
  {k:'AM',   label:'午前',   short:'前',hint:'〜11時'},
  {k:'LUNCH',label:'ランチ', short:'昼',hint:'11〜14時'},
  {k:'PM',   label:'午後',   short:'後',hint:'14〜18時'},
  {k:'NIGHT',label:'夜',     short:'夜',hint:'18時〜'},
  {k:'STAY', label:'宿泊可', short:'泊',hint:'泊まりOK',noAll:true}
];
var DAYSLOTS=SLOTS.filter(function(s){return !s.noAll;});
var SYM={OK:'○',MAYBE:'△',NG:'×'};
var LAB={OK:'行ける',MAYBE:'要相談',NG:'難しい'};
var WD=['日','月','火','水','木','金','土'];
var IDLE_MINUTES=10;                    // この時間、操作がないと自動ログアウト
var IDLE_MS=IDLE_MINUTES*60*1000;

function pad(n){return String(n).padStart(2,'0');}
function ds(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
var now=new Date();
var todayStr=ds(now.getFullYear(),now.getMonth(),now.getDate());
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s){return document.querySelector(s);}
function has(o,k){return Object.prototype.hasOwnProperty.call(o,k);}

/* ---------- 祝日(日本の国民の祝日。振替休日・国民の休日も計算) ---------- */
var HOL_CACHE={};
function nthMon(y,m,n){var dow=new Date(y,m-1,1).getDay();return 1+((8-dow)%7)+7*(n-1);}
function holidaysOf(y){
  if(HOL_CACHE[y])return HOL_CACHE[y];
  var h={};
  function add(m,d,n){h[pad(m)+'-'+pad(d)]=n;}
  add(1,1,'元日');
  add(1,nthMon(y,1,2),'成人の日');
  add(2,11,'建国記念の日');
  if(y>=2020)add(2,23,'天皇誕生日'); else if(y>=1989&&y<=2018)add(12,23,'天皇誕生日');
  add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)),'春分の日');
  add(4,29,'昭和の日'); add(5,3,'憲法記念日'); add(5,4,'みどりの日'); add(5,5,'こどもの日');
  if(y===2020)add(7,23,'海の日'); else if(y===2021)add(7,22,'海の日'); else add(7,nthMon(y,7,3),'海の日');
  if(y===2020)add(8,10,'山の日'); else if(y===2021)add(8,8,'山の日'); else add(8,11,'山の日');
  add(9,nthMon(y,9,3),'敬老の日');
  add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)),'秋分の日');
  if(y===2020)add(7,24,'スポーツの日'); else if(y===2021)add(7,23,'スポーツの日'); else add(10,nthMon(y,10,2),'スポーツの日');
  add(11,3,'文化の日'); add(11,23,'勤労感謝の日');
  function key(dt){return pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
  // 振替休日: 日曜の祝日は、次の「祝日でない日」が休みになる
  Object.keys(h).forEach(function(k){
    var m=Number(k.slice(0,2)),d=Number(k.slice(3));
    if(new Date(y,m-1,d).getDay()!==0)return;
    var t=new Date(y,m-1,d+1);
    while(h[key(t)])t=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);
    if(t.getFullYear()===y)h[key(t)]='振替休日';
  });
  // 国民の休日: 前日と翌日がどちらも祝日の平日
  Object.keys(h).forEach(function(k){
    var m=Number(k.slice(0,2)),d=Number(k.slice(3));
    var t=new Date(y,m-1,d+1), n=new Date(y,m-1,d+2);
    if(!h[key(t)]&&h[key(n)]&&t.getDay()!==0&&t.getFullYear()===y)h[key(t)]='国民の休日';
  });
  HOL_CACHE[y]=h; return h;
}
function holName(s){return holidaysOf(Number(s.slice(0,4)))[s.slice(5)]||'';}
function dateLabel(s){
  var p=s.split('-').map(Number);
  return p[1]+'月'+p[2]+'日('+WD[new Date(p[0],p[1]-1,p[2]).getDay()]+(holName(s)?'・祝':'')+')';
}
function shortLabel(s){var p=s.split('-').map(Number);return p[1]+'/'+p[2]+'('+WD[new Date(p[0],p[1]-1,p[2]).getDay()]+')';}

var S=null, D={offers:[],answers:[],confirms:[]}, idx={};
var view={y:now.getFullYear(),m:now.getMonth()};
var openDate=null, confirming=null;

/* ---------- パスワード(タブを閉じると消える sessionStorage にだけ置く) ---------- */
var pc='';
var PC_KEY='yotei_pc', LAST_KEY='yotei_last';
function ssGet(k){try{return sessionStorage.getItem(k)||'';}catch(e){return '';}}
function ssSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k);}catch(e){}}
try{localStorage.removeItem('futari_pc');}catch(e){}   // 旧版が端末に残したパスワードを消す

/* ---------- サーバー呼び出し(先頭の引数にパスワードを付ける) ----------
   API_URL が空 → GASの中で開いている場合(google.script.run を使う)
   API_URL がある → GitHub Pages など外に置いた場合(GASのURLへ fetch で送る) */
var API_URL='https://script.google.com/macros/s/AKfycbzo82CA6MOwsz_UIjAlYwgnQA9_kO18ZjsEsmCJZegHXQj_7usep1XBUnQGWNgpsk5aVw/exec';
function call(fn){
  var args=[pc].concat([].slice.call(arguments,1));
  if(!API_URL&&window.google&&google.script&&google.script.run){
    return new Promise(function(res,rej){
      var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e);});
      r[fn].apply(r,args);
    });
  }
  // Content-Type を text/plain にして、ブラウザの事前確認(preflight)を避ける。Cookie(Googleアカウント)は送らない
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json();},function(){throw new Error('通信に失敗しました');})
    .then(function(j){
      if(!j||!j.ok)throw new Error((j&&j.error)||'通信に失敗しました');
      return j.data;
    });
}
function isAuthErr(e){var m=(e&&e.message)||'';return m.indexOf('AUTH')>=0||m.indexOf('LOCKED')>=0;}
var pending=0, chain=Promise.resolve(), latest=null;
function enqueue(fn){
  pending++; showSaving();
  chain=chain.then(fn).then(function(r){latest=r;},function(e){toast(errMsg(e),true);latest='reload';}).then(function(){
    pending--; showSaving();
    if(pending===0){
      if(latest==='reload'){reload();}
      else if(latest){D=latest;build();renderAll();}
      latest=null;
    }
  });
}
function showSaving(){$('#saving').textContent=pending>0?'保存中…':'';}
function errMsg(e){
  var m=(e&&e.message)?String(e.message).replace(/^Error:\s*/,''):'通信に失敗しました';
  if(m.indexOf('LOCKED')>=0){
    var mm=/LOCKED:(\d+)/.exec(m), n=mm?Number(mm[1]):0;
    var wait=!n?'しばらく':(n>=120?'あと約'+Math.ceil(n/60)+'時間':'あと約'+n+'分');
    return '失敗が続いたため、ロックされています('+wait+'お待ちください)';
  }
  if(m.indexOf('AUTH')>=0)return 'パスワードがちがいます';
  return m;
}
function reload(){
  return call('apiInit').then(function(r){S={me:r.me,partner:r.partner,title:r.title};D=r.data;build();renderAll();})
    .catch(function(e){
      if(isAuthErr(e)){
        var m=errMsg(e);
        if((e.message||'').indexOf('LOCKED')>=0){ // ロック中
          if(S){toast(m,true);}else{pc='';showLogin(m);}
          return;
        }
        S=null; pc=''; ssDel(PC_KEY); showLogin(m); return; // パスワードが通らない → ログイン画面へ
      }
      if(!S){$('#main').innerHTML='<div class="center">開けませんでした。<br>'+esc(errMsg(e))+'</div>';} else toast(errMsg(e),true);
    });
}

/* ---------- ログイン画面 ---------- */
function showLogin(msg){
  close_();
  $('#who').innerHTML='';
  $('#main').innerHTML='<div class="login"><h2>ログイン</h2>'
    +'<p>パスワードを入力してください</p>'
    +'<input type="text" id="pcin" lang="ja" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="パスワード(8文字)">'
    +'<button type="button" class="lnk tg" id="pctoggle"></button>'
    +'<button class="btn" id="pcgo">ログイン</button>'
    +'<div class="msg" id="pcmsg">'+esc(msg||'')+'</div></div>';
  var go=function(){
    var v=$('#pcin').value; if(!v)return;
    pc=v; $('#pcmsg').textContent='確認中…'; $('#pcgo').disabled=true;
    call('apiInit').then(function(r){
      S={me:r.me,partner:r.partner,title:r.title};D=r.data;build();renderAll();
      ssSet(PC_KEY,v); lastActive=Date.now(); lastSaved=0; touch();
    }).catch(function(e){
      pc=''; var b=$('#pcgo'); if(b)b.disabled=false;
      var mm=$('#pcmsg'); if(mm)mm.textContent=errMsg(e);
    });
  };
  $('#pcgo').addEventListener('click',go);
  // 文字を隠す/表示する。初期状態は「表示」(日本語入力の変換中も見えるように)
  var pin=$('#pcin');
  var canMask=window.CSS&&CSS.supports&&(CSS.supports('-webkit-text-security','disc')||CSS.supports('text-security','disc'));
  var hide=false; try{hide=localStorage.getItem('yotei_hide')==='1';}catch(e){}
  function applyHide(){
    if(hide){
      if(canMask){pin.style.webkitTextSecurity='disc';pin.style.textSecurity='disc';}
      else{pin.type='password';}
    }else{
      pin.style.webkitTextSecurity='none';pin.style.textSecurity='none';pin.type='text';
    }
    $('#pctoggle').textContent=hide?'パスワードを表示する':'パスワードを隠す';
  }
  $('#pctoggle').addEventListener('click',function(){
    hide=!hide; try{localStorage.setItem('yotei_hide',hide?'1':'0');}catch(e){}
    applyHide(); pin.focus();
  });
  applyHide();
  // 漢字変換の確定のEnterでは、ログインしない
  pin.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229)go();});
}
function logout(msg){S=null;pc='';ssDel(PC_KEY);ssDel(LAST_KEY);showLogin(msg||'');}

/* ---------- 自動ログアウト(操作がないまま一定時間たつと) ---------- */
var lastActive=Date.now(), lastSaved=0;
function touch(){
  if(!S)return;
  lastActive=Date.now();
  if(lastActive-lastSaved>5000){lastSaved=lastActive;ssSet(LAST_KEY,String(lastActive));}
}
['click','keydown','touchstart','pointerdown','scroll','input'].forEach(function(ev){
  document.addEventListener(ev,touch,{passive:true,capture:true});
});
function checkIdle(){
  if(S&&Date.now()-lastActive>IDLE_MS){logout('操作がなかったため、自動的にログアウトしました');return true;}
  return false;
}
setInterval(checkIdle,15000);

/* ---------- データ索引 ---------- */
function build(){
  idx={offer:{},ans:{},conf:{}};
  D.offers.forEach(function(o){idx.offer[o.date+'|'+o.slot+'|'+o.by]=o;});
  D.answers.forEach(function(a){idx.ans[a.date+'|'+a.slot+'|'+a.by]=a;});
  D.confirms.forEach(function(c){idx.conf[c.date+'|'+c.slot]=c;});
}
function st(d,s){
  var k=d+'|'+s, me=S.me.id, pt=S.partner.id;
  var conf=idx.conf[k], mO=idx.offer[k+'|'+me], pO=idx.offer[k+'|'+pt];
  var mo=!!mO, po=!!pO;
  var myAns=idx.ans[k+'|'+me], ptAns=idx.ans[k+'|'+pt];
  var kind=null, sym='';
  if(conf){kind='conf';sym='確';}
  else if(mo&&po){kind='both';sym='◎';}
  else if(po){kind='pt';sym=myAns?SYM[myAns.answer]:'!';}
  else if(mo){kind='me';sym=ptAns?SYM[ptAns.answer]:'…';}
  return {kind:kind,sym:sym,conf:conf,mo:mo,po:po,myAns:myAns,ptAns:ptAns,
          myComment:mO?(mO.comment||''):'',ptComment:pO?(pO.comment||''):''};
}

/* ---------- 楽観的な画面更新(サーバー側と同じ規則) ---------- */
function localSetOffers(date,slots,comments){
  var me=S.me.id; comments=comments||{};
  var beforeObjs=D.offers.filter(function(o){return o.date===date&&o.by===me;});
  var oldC={}; beforeObjs.forEach(function(o){oldC[o.slot]=o.comment||'';});
  var before=beforeObjs.map(function(o){return o.slot;});
  var keep={}; slots.forEach(function(s){keep[s]=1;});
  before.forEach(function(s){if(idx.conf[date+'|'+s])keep[s]=1;});
  var dropped=before.filter(function(s){return !keep[s];});
  D.offers=D.offers.filter(function(o){return !(o.date===date&&o.by===me);});
  Object.keys(keep).forEach(function(s){
    D.offers.push({date:date,slot:s,by:me,comment:has(comments,s)?String(comments[s]).trim().slice(0,100):(oldC[s]||'')});
  });
  D.answers=D.answers.filter(function(a){return !(a.date===date&&dropped.indexOf(a.slot)>=0&&a.by!==me);});
  build();
}
function localSetAnswers(date,items){
  var me=S.me.id;
  items.forEach(function(it){
    D.answers=D.answers.filter(function(a){return !(a.date===date&&a.slot===it.slot&&a.by===me);});
    if(it.answer)D.answers.push({date:date,slot:it.slot,by:me,answer:it.answer,comment:it.comment||''});
  });
  build();
}

function summaryHtml(){
  var need=[],wait=0;
  D.offers.forEach(function(o){
    if(o.date<todayStr)return;
    var t=st(o.date,o.slot);
    if(t.kind==='pt'&&!t.myAns)need.push(o.date);
    if(t.kind==='me'&&!t.ptAns)wait++;
  });
  need.sort();
  var h='<div class="summary">';
  if(need.length){
    h+='<div class="sum need"><span>'+esc(S.partner.name)+'の空きに <b>'+need.length+'</b> 枠、未回答があります</span>'
      +'<button data-act="gonext" data-date="'+need[0]+'">回答する</button></div>';
  }else{
    h+='<div class="sum"><span>未回答はありません</span></div>';
  }
  h+='<div class="sum"><span>あなたの提示で回答待ち <b>'+wait+'</b> 枠</span></div></div>';
  return h;
}

function calHtml(){
  var y=view.y,m=view.m,first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  var h='<div class="cal">';
  WD.forEach(function(w,i){h+='<div class="wd'+(i===0?' sun':'')+'">'+w+'</div>';});
  for(var i=0;i<first;i++)h+='<div class="day blank"></div>';
  for(var d=1;d<=dim;d++){
    var s=ds(y,m,d), dow=(first+d-1)%7, needDay=false, hn=holName(s);
    var pills=SLOTS.map(function(sl){
      var t=st(s,sl.k);
      if(t.kind==='pt'&&!t.myAns&&s>=todayStr)needDay=true;
      return t.kind?'<span class="pill k-'+t.kind+'"><b>'+sl.short+'</b><i>'+t.sym+'</i></span>'
                   :'<span class="pill empty"><b>'+sl.short+'</b></span>';
    }).join('');
    h+='<button class="day'+(s<todayStr?' past':'')+(s===todayStr?' today':'')+(dow===0?' sun':'')+(hn?' hol':'')+(needDay?' need':'')
      +'" data-act="open" data-date="'+s+'"'+(hn?' title="'+esc(hn)+'"':'')+'><span class="n"><b>'+d+'</b>'+(hn?'<small>'+esc(hn)+'</small>':'')+'</span>'+pills+'</button>';

}

function slotsLabel(keys){
  var allDay=DAYSLOTS.every(function(s){return keys.indexOf(s.k)>=0;});
  var parts=[];
  if(allDay)parts.push('1日中');
  SLOTS.forEach(function(s){
    if(keys.indexOf(s.k)<0)return;
    if(allDay&&!s.noAll)return;
    parts.push(s.label);
  });
  return parts.join('・');
}

function confirmedListHtml(){
  var groups={};
  D.confirms.forEach(function(c){
    if(c.date<todayStr)return;
    var k=c.date+'|'+c.title+'|'+c.memo;
    (groups[k]=groups[k]||{date:c.date,title:c.title,memo:c.memo,slots:[]}).slots.push(c.slot);
  });
  var arr=Object.keys(groups).map(function(k){return groups[k];}).sort(function(a,b){return a.date<b.date?-1:1;});

      +'<span class="t">'+esc(g.title)+(g.memo?'<div class="s">'+esc(g.memo)+'</div>':'')+'</span><span class="s">'+slotsLabel(g.slots)+'</span></li>';

function cardHtml(d,s,t,ro){

  if(t.kind==='conf'){
    var c=t.conf;
    return '<div class="card conf"><div class="ch"><b>'+s.label+'</b><span class="hint">'+s.hint+'</span><span class="badge conf">確定</span></div>'
      +'<div class="ct">'+esc(c.title)+'</div>'+(c.memo?'<div class="cm">'+esc(c.memo)+'</div>':'')
      +(ro?'':'<button class="lnk" data-act="unconfirm" data-slot="'+s.k+'">確定を取り消す</button>')+'</div>';
  }
  var badge={both:['both','2人とも空き'],pt:['pt',esc(pt.name)+'が提示'],me:['me','あなたが提示']}[t.kind];
  var h='<div class="card k-'+t.kind+'"><div class="ch"><b>'+s.label+'</b><span class="hint">'+s.hint+'</span>'
    +'<span class="badge '+badge[0]+'">'+badge[1]+'</span></div>';
  if(t.ptComment&&(t.kind==='pt'||t.kind==='both')){
    h+='<div class="cmtshow">'+esc(pt.name)+'のコメント: '+esc(t.ptComment)+'</div>';
  }

    h+='<p class="note OK">2人とも空いています。そのまま確定できます。</p>';
  }else if(t.kind==='pt'){
    h+='<p class="note">'+esc(pt.name)+'が空きを出しています。ご都合は?</p><div class="ans">'
      +['OK','MAYBE','NG'].map(function(v){
        return '<button class="ab '+v+(t.myAns&&t.myAns.answer===v?' on':'')+'" data-act="ans" data-slot="'+s.k+'" data-val="'+v+'"'+(ro?' disabled':'')+'>'+SYM[v]+' '+LAB[v]+'</button>';
      }).join('')+'</div>'
      +'<input type="text" class="cmt" data-slot="'+s.k+'" maxlength="100" placeholder="コメント(任意) 例:19時以降なら"'
      +' value="'+esc(t.myAns?t.myAns.comment:'')+'"'+(ro?' disabled':'')+'>';
  }else if(t.kind==='me'){
    if(t.ptAns){
      h+='<p class="note '+t.ptAns.answer+'">'+esc(pt.name)+'の回答: <b>'+SYM[t.ptAns.answer]+' '+LAB[t.ptAns.answer]+'</b></p>'
        +(t.ptAns.comment?'<div class="cmtshow">コメント: '+esc(t.ptAns.comment)+'</div>':'');
    }else{

    }

// 確定は、1日につき最後に1つだけ。どの時間帯を確定するかは、ここで選ぶ
function confirmHtml(d,sts){
  var cand=SLOTS.filter(function(x,i){return sts[i].kind&&sts[i].kind!=='conf';});
  if(!cand.length)return '';
  if(!confirming)return '<button class="confirm-open" data-act="confirmopen">確定</button>';
  // 2人の都合が合っている枠(◎、または回答が ○/△)を、最初からチェックしておく
  function agreed(t){
    return t.kind==='both'||(t.kind==='pt'&&t.myAns&&t.myAns.answer!=='NG')||(t.kind==='me'&&t.ptAns&&t.ptAns.answer!=='NG');
  }
  return '<div class="cform">'
    +'<div class="lb">予定名(任意) 例:打ち合わせ</div><input type="text" class="c-title" maxlength="60">'
    +'<div class="lb">確定する時間帯(複数選べます)</div>'
    +'<div class="row">'+cand.map(function(x){
      return '<label><input type="checkbox" class="c-slot" value="'+x.k+'"'+(agreed(st(d,x.k))?' checked':'')+'>'+x.label+'</label>';
    }).join('')+'</div>'
    +'<div class="lb">メモ(任意) 例:場所・持ち物</div><input type="text" class="c-memo" maxlength="200">'
    +'<div class="btns"><button class="btn" data-act="confirmdo">確定する</button><button class="btn ghost" data-act="confirmcancel">やめる</button></div></div>';
}

/* ---------- 操作 ---------- */
function mySlots(d){return SLOTS.filter(function(s){return st(d,s.k).mo;}).map(function(s){return s.k;});}
function offerComments(){
  var m={};
  [].forEach.call(document.querySelectorAll('#panel .ocmt'),function(el){m[el.getAttribute('data-slot')]=el.value;});
  return m;
}
function setOffers(d,slots,comments){
  localSetOffers(d,slots,comments); renderAll();
  enqueue(function(){return call('apiSaveOffers',d,slots,comments||{});});
}
function saveAnswers(d,items){
  localSetAnswers(d,items); renderAll();
  enqueue(function(){return call('apiSaveAnswers',d,items);});
}
function cardComment(slot){var el=$('#panel .cmt[data-slot="'+slot+'"]');return el?el.value:'';}

function open_(d){
  openDate=d; confirming=null;
  var p=d.split('-').map(Number); view={y:p[0],m:p[1]-1};
  $('#sheet').classList.remove('hidden');
  renderAll();
  $('#panel').scrollTop=0;
}
function close_(){openDate=null;confirming=null;$('#sheet').classList.add('hidden');}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el||el.disabled)return;
  var act=el.getAttribute('data-act'), slot=el.getAttribute('data-slot'), val=el.getAttribute('data-val'), date=el.getAttribute('data-date');
  var d=openDate;
  switch(act){
    case 'prev': view.m--; if(view.m<0){view.m=11;view.y--;} renderAll(); break;
    case 'next': view.m++; if(view.m>11){view.m=0;view.y++;} renderAll(); break;
    case 'today': view={y:now.getFullYear(),m:now.getMonth()}; renderAll(); break;
    case 'open': open_(date); break;
    case 'gonext': open_(date); break;
    case 'close': close_(); break;
    case 'logout': logout(''); break;
    case 'chip': {
      var cur=mySlots(d), i=cur.indexOf(slot);
      if(i>=0)cur.splice(i,1); else cur.push(slot);
      setOffers(d,cur,offerComments()); break;
    }
    case 'chipall': {
      var cs=mySlots(d), allKeys=DAYSLOTS.map(function(s){return s.k;});
      var full=allKeys.every(function(k){return cs.indexOf(k)>=0;});
      var next=full?cs.filter(function(k){return allKeys.indexOf(k)<0;}):allKeys.concat(cs.filter(function(k){return allKeys.indexOf(k)<0;}));
      setOffers(d,next,offerComments()); break;
    }
    case 'ans': {
      var t=st(d,slot), same=t.myAns&&t.myAns.answer===val;
      saveAnswers(d,[{slot:slot,answer:same?'':val,comment:same?'':cardComment(slot)}]); break;
    }
    case 'ansall': {
      var items=SLOTS.filter(function(s){return st(d,s.k).kind==='pt';}).map(function(s){
        var t2=st(d,s.k); return {slot:s.k,answer:val,comment:t2.myAns?t2.myAns.comment:''};
      });
      saveAnswers(d,items); break;
    }
    case 'confirmopen': confirming=true; renderSheet(); var ti=$('#panel .c-title'); if(ti)ti.focus(); break;
    case 'confirmcancel': confirming=false; renderSheet(); break;
    case 'confirmdo': {
      var title=$('#panel .c-title').value, memo=$('#panel .c-memo').value;
      var slots=[].slice.call(document.querySelectorAll('#panel .c-slot:checked')).map(function(x){return x.value;});
      if(!slots.length){toast('時間帯を選んでください',true);break;}
      confirming=null;
      enqueue(function(){return call('apiConfirm',d,slots,title,memo);});
      toast('確定しました'); break;
    }
    case 'unconfirm': {
      var c=idx.conf[d+'|'+slot]; if(!c)break;
      var group=SLOTS.filter(function(s){var x=idx.conf[d+'|'+s.k];return x&&x.title===c.title&&x.memo===c.memo;}).map(function(s){return s.k;});
      if(!confirm('この確定を取り消しますか?'))break;
      enqueue(function(){return call('apiUnconfirm',d,group);}); break;
    }
  }
});
// コメントを書き換えたとき
document.addEventListener('change',function(e){
  var el=e.target; if(!el.classList)return;
  if(el.classList.contains('ocmt')){ // 空き時間のコメント
    setOffers(openDate,mySlots(openDate),offerComments());
    return;
  }
  if(el.classList.contains('cmt')){ // 回答のコメント(回答済みの場合だけ保存)
    var slot=el.getAttribute('data-slot'), t=st(openDate,slot);
    if(t.myAns)saveAnswers(openDate,[{slot:slot,answer:t.myAns.answer,comment:el.value}]);
    else toast('先に ○ △ × を選ぶと、コメントも一緒に送られます');
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openDate)close_();});

var toastTimer;
function toast(msg,isErr){
  var t=$('#toast'); t.textContent=msg; t.className='show'+(isErr?' err':'');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.className='';},2600);
}

// 相手の更新を取り込む(シートを開いていない時だけ)。自動更新は「操作」には数えない
setInterval(function(){if(!document.hidden&&!openDate&&pending===0&&S&&!checkIdle())reload();},30000);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(checkIdle())return;
  if(!openDate&&pending===0&&S)reload();
});

// 起動: タブ内で最近まで操作していた場合だけ、そのまま続きから。それ以外はログイン画面
pc=ssGet(PC_KEY);
var lastSeen=Number(ssGet(LAST_KEY)||0);
if(pc&&Date.now()-lastSeen<IDLE_MS){
  lastActive=Date.now(); reload();
}else{
  var had=!!pc; pc=''; ssDel(PC_KEY); ssDel(LAST_KEY);
  showLogin(had?'操作がなかったため、自動的にログアウトしました':'');
}
})();
</script>
</body>
</html>
